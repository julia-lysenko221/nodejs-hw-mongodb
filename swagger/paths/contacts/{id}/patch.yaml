tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
    description: The ID of the contact to update
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
          - userId
          - photo
        properties:
          name:
            type: string
            description: Contacts name
            example: Jane Spring
          phoneNumber:
            type: string
            description: Contacts phone number
            example: '+380501234567'
          email:
            type: string
            description: Contacts mail
            example: 'jane@example.com'
          isFavourite:
            type: boolean
            description: Indicates whether the contact is marked as a favorite
            example: false
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            description: Defines the category of the contact
            example: home
          userId:
            type: string
            description: Contacts owner id
            example: 68efd834f1781f960b1e7a6c
          photo:
            type: string
            default: null
            description: Contact avatar
            example: https://res.cloudinary.com/dha4xvgfi/image/upload/v1759947947/aclxd7sbpsrb8hviowbe.jpg

responses:
  '200':
    description: Update contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '../../../components/schemas/contact.yaml'

  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
