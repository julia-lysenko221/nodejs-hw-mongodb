tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - _id
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
          - userId
          - photo
        properties:
_id:
  type: string
  description: Contacts id
  example: 68efd41636a23320bb4ef586
name:
  type: string
  description: Contacts name
  example: Jane Spring
phoneNumber:
  type: string
  description: Contacts phone number
  example: '+380501234567'
email:
  type: string
  description: Contacts mail
  example: 'jane@example.com'
isFavourite:
  type: Boolean
  description: Indicates whether the contact is marked as a favorite
  example: false
contactType:
  type: string
  enum: ['work', 'home', 'personal']
  description: Defines the category of the contact
  example: home
userId:
  type: string
  description: Contacts owner id
  example: 68efd834f1781f960b1e7a6c
photo:
  type: string
  default: null
  description: Contact avatar
  example: https://res.cloudinary.com/dha4xvgfi/image/upload/v1759947947/aclxd7sbpsrb8hviowbe.jpg

responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: ../../components/responses/500.yaml
